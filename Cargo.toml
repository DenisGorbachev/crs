[workspace]
resolver = "3"
members = ["packages/*"]
# "crs-cli-spec" must be a workspace member because mise tasks run only on the top-level workspace

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
repository = "https://github.com/DenisGorbachev/crs"
keywords = []
categories = []
exclude = [
    ".*",
    "*.local.*",
    "doc/dev",
    "specs",
    "AGENTS.ts",
    "CargoMetadata.ts",
    "README.ts",
    "AGENTS*.md",
    "deno.lock",
    "deno.json",
    "clippy.toml",
    "commitlint.config.mjs",
    "fnox.toml",
    "mise.toml",
    "nu-lint.toml",
    "nufmt.nuon",
    "rumdl.toml",
    "shuck.toml",
    "rustfmt.toml",
    "rust-toolchain.toml",
    "release-plz.toml",
    "skills-lock.json",
    ".yolobox"
]

[workspace.metadata.details]
name = "crs"
title = "Code review system"
readme = { generate = false }

[workspace.lints.rust]
redundant_imports = "deny"
unused_import_braces = "deny"
# unused_qualifications must not be "deny" because our code style has multiple `use Foo::*;`, and some macros (derive_more::Display, strum::Display, strum::EnumString) produce code with full qualifications
# unused_qualifications = "deny"

[workspace.lints.clippy]
# Rust 1.100 reports redundant fields inside derive macros: https://github.com/rust-lang/rust-clippy/issues/17525.
redundant_field_names = "allow"
absolute_paths = "deny"
arithmetic_side_effects = "deny"

[workspace.dependencies]
# codex-tui requires base64 >= 0.22.1.
base64 = "0.22.0"
eventsource-stream = "0.2.0"
openai_dive = { git = "https://github.com/DenisGorbachev/openai-dive", rev = "bd7a16dafb4657fd24ff449953b3415cf062ff16", default-features = false, features = ["reqwest", "rustls-tls"] }
secrecy = "0.10.0"
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "9a758255ea26e2b20c8cecf4c1c946feb9e71da7" }
derive_more = { version = "2.1.0", features = ["deref", "deref_mut"] }
dioxus = { version = "0.7.0", default-features = false, features = ["fullstack", "macro", "html", "hooks", "signals", "logger", "cli-config"] }
axum = "0.8.0"
time = { version = "0.3.0", features = ["serde", "formatting", "parsing"] }
toml = "0.9.0"
tracing = "0.1.0"
url = { version = "2.5.0", features = ["serde"] }
clap = { version = "4.5.11", features = ["derive", "env"] }
errgonomic = { git = "https://github.com/DenisGorbachev/errgonomic" }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.39.2", features = ["macros", "fs", "net", "rt", "rt-multi-thread"] }
futures = { version = "0.3.34" }
git2 = "0.21.0"
timestamp-please = { git = "https://github.com/DenisGorbachev/timestamp-please", features = ["serde", "time"] }
fjall = { version = "3.1.10" }
rkyv = { version = "0.8.16", features = ["unaligned"] }
pulldown-cmark = "0.13.0"
# codex-shell-command requires tree-sitter >= 0.25.10.
tree-sitter = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.0"
uuid = "1.26.0"
codex-protocol = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0", version = "0.169.0" }
# serde_json requires serde >= 1.0.220; retain the compatible lockfile version instead of pinning 1.0.0.
serde = "1.0.0"
serde_json = "1.0.0"
codex-app-server-client = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0", version = "0.169.0" }
codex-utils-absolute-path = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0", version = "0.169.0" }
codex-utils-home-dir = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0", version = "0.169.0" }
codex-tui = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0", version = "0.169.0" }
codex-app-server-protocol = { git = "https://github.com/openai/codex", tag = "rust-v0.169.0", version = "0.169.0" }
interval-zoo = { git = "https://github.com/DenisGorbachev/interval-zoo" }

[patch.crates-io]
# Codex's V8 patch is not required by CRS.
# `codex-tui` requires the buffered-input APIs from the Codex workspace's crossterm fork.
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "ed1cdab335221515706178d68495bba2aed1924f" }
# Keep Codex's SQLx driver and core on the same source for libsqlite3-sys 0.39 support.
sqlx-core = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-sqlite = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
# `codex-thread-store` relies on the fork-only proxy support used by the Codex workspace.
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "7447c427513cfe685f236e1ac0513c4ea3dd9c0b" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "bc589d684755a8c02da0fc7e58d0861cbfc306f1" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "bc589d684755a8c02da0fc7e58d0861cbfc306f1" }
