[package]
name = "crs-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[lints]
workspace = true

[[bin]]
name = "crs-web"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
server = ["dioxus/server", "dep:codex-app-server-client", "dep:dioxus-primitives", "dep:errgonomic", "dep:fjall", "dep:openai_dive", "dep:pulldown-cmark", "dep:tree-sitter-javascript", "dep:tree-sitter-python", "dep:tree-sitter-rust"]

[dependencies]
axum.workspace = true
base64.workspace = true
clap.workspace = true
codex-app-server-client = { workspace = true, optional = true }
codex-app-server-protocol.workspace = true
codex-utils-absolute-path.workspace = true
codex-utils-home-dir.workspace = true
derive_more.workspace = true
dioxus = { workspace = true, features = ["router", "document", "ssr"] }
dioxus-primitives = { workspace = true, optional = true }
errgonomic = { workspace = true, optional = true }
eventsource-stream.workspace = true
fjall = { workspace = true, optional = true }
futures.workspace = true
openai_dive = { workspace = true, optional = true }
pulldown-cmark = { workspace = true, optional = true }
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["signal", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
tree-sitter.workspace = true
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
url.workspace = true
uuid = { workspace = true, features = ["v4"] }
