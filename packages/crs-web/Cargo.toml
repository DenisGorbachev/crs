[package]
name = "crs-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[lints]
workspace = true

[[bin]]
name = "crs-web"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
server = ["dioxus/server"]

[dependencies]
axum.workspace = true
base64.workspace = true
clap.workspace = true
codex-app-server-client.workspace = true
codex-app-server-protocol.workspace = true
codex-utils-absolute-path.workspace = true
codex-utils-home-dir.workspace = true
derive_more.workspace = true
dioxus = { workspace = true, features = ["router", "document", "ssr"] }
dioxus-primitives.workspace = true
errgonomic.workspace = true
eventsource-stream.workspace = true
fjall.workspace = true
futures.workspace = true
openai_dive.workspace = true
pulldown-cmark.workspace = true
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["signal", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
tree-sitter.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4"] }
